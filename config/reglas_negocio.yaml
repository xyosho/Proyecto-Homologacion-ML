# =============================================================================
# REGLAS DE NEGOCIO Y PARÁMETROS DEL GENERADOR — Semana 1
# Proyecto: Modelo Predictivo de Segmentación de Mercado y Propensión a la Matrícula
# Unicervantes · Ing. en Analítica de Datos (AD) e Ing. en Sistemas de Software e IA (SSIA)
#
# Convención:
#   - Todo valor con "fuente" proviene de un documento verificable (ver docs/fuentes.md).
#   - Todo valor marcado "supuesto: S-xx" es una decisión de modelado SIN fuente directa.
#     Debe validarse con el área de Admisiones (ver lista "supuestos" al final).
# =============================================================================

proyecto:
  semilla: 20261022            # semilla fija -> los datos son reproducibles
  n_leads: 7500                # leads (contactos registrados) a generar; ~40% se inscribe (S-23)
  fecha_corte: "2026-10-19"    # "hoy": lo posterior a esta fecha no se conoce (censura)

campus:
  nombre: "Campus Unicervantes"
  direccion: "Calle 209 No. 104-15, vía Arrayanes, Bogotá"
  lat: 4.790438
  lon: -74.066288
  fuente: "Dirección: Acuerdo 002/2025 (membrete). Coordenada exacta de la placa Calle 209 # 104-15 (CL 209 104 15, lote 009140001001) en Placa Domiciliaria de Catastro Bogotá (UAECD), consultada 23-oct-2026. Antes se usaba una coordenada aproximada de OpenStreetMap (4.7895, -74.0660), a unos 100 m."

programas:
  AD:
    nombre: "Ingeniería en Analítica de Datos"
    snies: 116144
    resolucion: "Resolución MEN 16782 del 12 de septiembre de 2023 (vigencia 7 años)"
    fecha_registro: "2023-09-12"
    primer_periodo: "2024-1"
    semestres: 8
    creditos: 134
    fuente: "Página oficial del programa y cuadernillo 'Del colegio a la U' 2026."
  SSIA:
    nombre: "Ingeniería en Sistemas de Software e Inteligencia Artificial"
    snies: 118928
    resolucion: "Resolución MEN 011486 del 30 de abril de 2026 (vigencia 7 años)"
    fecha_registro: "2026-04-30"
    primer_periodo: "2026-2"   # no puede haber aspirantes antes del registro calificado
    semestres: 8
    creditos: null
    fuente: "Cuadernillo 'Del colegio a la U' 2026 y folleto digital del programa (SNIES según folleto; verificar en SNIES)."

# Valor de matrícula semestral (COP) por programa y año calendario
tarifas:
  AD:
    2024: {valor: 4419000, fuente: "Precio de matrícula según recibos de pago: orden de pago Pregrado 2024-2, concepto 'MAT ING ANALITICA DE DATOS NUEVOS'."}
    2025: {valor: 4658000, fuente: "Precio de matrícula según recibos de pago 2025-1 y 2025-2: $3.260.600 con beca del 30% => 3.260.600 / 0,70; coincide con la versión 2025 de la página del programa."}
    2026: {valor: 4914000, fuente: "Acuerdo 002 del 11 de noviembre de 2025 del Consejo Directivo, art. 2 (valores de matrícula 2026)."}
    2027: {valor: 4914000, fuente: "supuesto: S-01 (se mantiene el valor vigente hasta que se publique el acuerdo 2027)."}
  SSIA:
    2026: {valor: 4950000, fuente: "Oferta académica oficial unicervantes.edu.co/admision/oferta-academica (consultada 19-oct-2026)."}
    2027: {valor: 4950000, fuente: "supuesto: S-01."}

# Escenario del documento de alcance del profesor (NO se usa por defecto; ver bitácora, hallazgo H-01)
escenario_alcance_profesor:
  AD: 4950000
  SSIA: 5817000
  nota: "Según el Acuerdo 002/2025, $5.817.000 corresponde a Derecho y $4.950.000 a SSIA."

derechos_pecuniarios_2026:
  inscripcion_pregrado: 113000
  valor_asignatura_pregrado: 711000
  recargo_pago_extraordinario: 0.05
  recargo_pago_extemporaneo: 0.10
  fuente: "Acuerdo 002/2025, arts. 5 y 6."

becas:
  SABER_11:
    nombre: "Beca Saber 11"
    umbral_icfes: 310            # puntaje global >= 310
    pct_primer_periodo: 0.30
    pct_siguientes: 0.30         # 30% para toda la carrera
    promedio_minimo: 4.0
    fuente: "Página oficial de Admisiones: 'Puntaje igual o superior a 310 ... 30% para toda la carrera por promedio académico'."
  MI_VOCACION:
    nombre: "Beca Cervantes #MiVocación"
    pct_primer_periodo: 0.30
    pct_siguientes: 0.20
    promedio_minimo: 4.0
    fuente: "Admisiones ('30% para el primer periodo académico y en adelante según la tabla relacionada'; se mantiene con promedio acumulado >= 4.0 y se pierde por sanciones); landing del programa ('30% 1er semestre y 20% el resto de la carrera')."
  NINGUNA:
    nombre: "Sin beca"
    pct_primer_periodo: 0.0
    pct_siguientes: 0.0
    promedio_minimo: null
  acumulables: false             # supuesto: S-02 (se aplica la beca de mayor porcentaje)

pronto_pago:
  pct: 0.05
  solo_primer_semestre: true     # el recibo 2024-2 muestra 35% (=30%+5%) y los siguientes 30%
  pago_minimo: 1000000
  fuente: "Admisiones (5% adicional pagando en 7 días, mínimo $1.000.000); orden de pago 2024-2."

# Escala histórica de la Resolución 013 de 2021 (solo referencia; NO se usa en el generador)
escala_saber11_res_013_2021:
  tramos:
    - {desde: 300, hasta: 324, pct: 0.15}
    - {desde: 325, hasta: 349, pct: 0.20}
    - {desde: 350, hasta: 500, pct: 0.25}
  nota: "Solo primer semestre. Reemplazada en la práctica por la política vigente de Admisiones (>= 310 -> 30%)."

# Periodos académicos. 'historico' = resultado conocido; 'campana' = en curso (sin resultado)
periodos_fuente: "supuesto: S-03 (fechas aproximadas; febrero y agosto según cuadernillo de admisiones)."
periodos:
  - {codigo: "2024-1", inicio_clases: "2024-02-05", fin: "2024-06-15", estado: historico}
  - {codigo: "2024-2", inicio_clases: "2024-08-05", fin: "2024-12-07", estado: historico}
  - {codigo: "2025-1", inicio_clases: "2025-02-03", fin: "2025-06-14", estado: historico}
  - {codigo: "2025-2", inicio_clases: "2025-08-04", fin: "2025-12-06", estado: historico}
  - {codigo: "2026-1", inicio_clases: "2026-02-02", fin: "2026-06-13", estado: historico}
  - {codigo: "2026-2", inicio_clases: "2026-08-03", fin: "2026-12-05", estado: historico}
  - {codigo: "2027-1", inicio_clases: "2027-02-01", fin: "2027-06-12", estado: campana}

# -----------------------------------------------------------------------------
# PARÁMETROS DEL GENERADOR (cada uno ligado a un supuesto o a una fuente)
# -----------------------------------------------------------------------------
generador:
  # Peso relativo de leads por (programa, periodo de interés). supuesto: S-04
  volumen_relativo:
    AD:   {"2024-1": 260, "2024-2": 150, "2025-1": 330, "2025-2": 190, "2026-1": 380, "2026-2": 220, "2027-1": 150}
    SSIA: {"2026-2": 260, "2027-1": 170}

  # Etapa 2: selección de la población Saber 11 hacia el perfil de aspirante. supuesto: S-05
  seleccion:
    peso_estrato: {1: 0.55, 2: 1.0, 3: 1.15, 4: 0.95, 5: 0.55, 6: 0.30}
    peso_genero: {F: 0.45, M: 1.0}          # ingenierías TIC con predominio masculino (SNIES)
    peso_puntaje:                           # [desde, hasta) del puntaje global
      - {desde: 0,   hasta: 200, peso: 0.55}
      - {desde: 200, hasta: 250, peso: 0.90}
      - {desde: 250, hasta: 310, peso: 1.00}
      - {desde: 310, hasta: 350, peso: 0.80}
      - {desde: 350, hasta: 400, peso: 0.45}
      - {desde: 400, hasta: 501, peso: 0.15}
    beta_distancia: 1.2                     # modelo gravitacional de Huff: peso ∝ distancia^(-beta)
    distancia_minima_km: 2.0

  # Años entre presentar el Saber 11 y la inscripción. supuesto: S-06 (tránsito inmediato Bogotá 52%, MEN 2023)
  rezago_anios: {0: 0.60, 1: 0.20, 2: 0.08, 3: 0.05, 4: 0.03, 5: 0.02, 6: 0.01, 8: 0.01}

  # Documento de extranjeros. PEP no se genera (vencido desde 28-feb-2023). supuesto: S-07
  documento_extranjero: {PPT: 0.70, CE: 0.30}

  # Estado civil por grupo de edad (menores de 18: siempre soltero, Ley 2447 de 2025). supuesto: S-08
  estado_civil:
    "18-22": {SOLTERO: 0.970, UNION_LIBRE: 0.025, CASADO: 0.005}
    "23-29": {SOLTERO: 0.850, UNION_LIBRE: 0.110, CASADO: 0.040}
    "30+":   {SOLTERO: 0.600, UNION_LIBRE: 0.250, CASADO: 0.150}

  prob_telefono_fijo: 0.35                  # supuesto: S-09

  # Canal de captación. supuesto: S-10
  canal: {EXPOESTUDIANTES: 0.20, SITIO_WEB: 0.14, REDES_SOCIALES: 0.16, REFERIDO: 0.12, CAMPUS_DAY: 0.08, LLAMADA_WHATSAPP: 0.10, INMERSION: 0.05, COLEGIO_CONVENIO: 0.15}
  prob_colegio_convenio: 0.12               # fracción de colegios con convenio. supuesto: S-11

  prob_entrevista: 0.85                     # supuesto: S-12
  prob_admitido: 0.97                       # sin examen de admisión. supuesto: S-12
  prob_solicita_beca_saber11: 0.95          # supuesto: S-13
  prob_mi_vocacion_por_puntaje_vocacional: {1: 0.0, 2: 0.0, 3: 0.25, 4: 0.75, 5: 0.90}   # supuesto: S-13
  prob_pronto_pago: 0.45                    # supuesto: S-14

  # Modelo logístico VERDADERO de matrícula (los coeficientes se recuperan en la validación). supuesto: S-15
  matricula:
    tasa_objetivo: 0.45                     # proporción de inscritos que se matriculan
    beta_descuento: 3.0                     # por unidad de % (0.30 -> +0.9 en log-odds)
    beta_estrato: {1: -0.50, 2: -0.15, 3: 0.0, 4: 0.10, 5: 0.0, 6: -0.30}
    beta_log_distancia: -0.35               # log(distancia_km / 10)
    beta_icfes_cuadratico: -0.25            # -0.25 * ((global - 280) / 50)^2  (U invertida)
    beta_canal: {EXPOESTUDIANTES: -0.30, SITIO_WEB: 0.0, REDES_SOCIALES: -0.10, REFERIDO: 0.50, CAMPUS_DAY: 0.30, LLAMADA_WHATSAPP: -0.20, INMERSION: 0.80, COLEGIO_CONVENIO: 0.30}
    beta_entrevista: 0.60
    beta_programa_ssia: 0.10
    beta_periodo_2: -0.10
    beta_foes: 0.50                         # apoyo aprobado de un fondo municipal (FOES/FOEST). supuesto: S-31

  # Rendimiento académico (escala 0.0-5.0). supuesto: S-16 (correlación ICFES-promedio moderada)
  rendimiento:
    media: 3.95
    rho_icfes: 0.45                         # correlación latente entre habilidad y puntaje global
    rho_esfuerzo_colegio: 0.30              # peso del esfuerzo que se ve en las notas del colegio (S-36)
    sd_estudiante: 0.38                     # variación entre estudiantes
    sd_semestre: 0.22                       # variación de un semestre a otro
    ajuste_primer_semestre: -0.10
    efecto_estrato_bajo: -0.05              # estratos 1-2
    prob_sancion_semestre: 0.005

  # Deserción por semestre cursado. supuesto: S-17 (SPADIES: ~9% anual; mayor en primeros semestres)
  desercion:
    riesgo_base: {1: 0.12, 2: 0.08, 3: 0.05}   # semestre 3 en adelante usa 0.05
    multiplicador_promedio_bajo: 2.5        # promedio del semestre < 3.0
    multiplicador_perdio_beca: 1.5

  # ---------------- BLOQUE 1 y 5: captación de leads (antes de la inscripción)
  captacion:
    n_asesores: 6
    sd_efecto_asesor: 0.30                  # efecto aleatorio de cada asesor en la conversión (S-23)
    retraso_inscripcion_gamma: {forma: 2.0, escala_dias: 12}   # días entre registro e inscripción (S-23)
    conversion_lead:                        # modelo logístico VERDADERO lead -> inscripción (S-23)
      tasa_objetivo: 0.40
      alpha_canal: {EXPOESTUDIANTES: -0.60, SITIO_WEB: 0.0, REDES_SOCIALES: -0.30, REFERIDO: 0.80, CAMPUS_DAY: 0.60, LLAMADA_WHATSAPP: -0.20, INMERSION: 1.20, COLEGIO_CONVENIO: 0.50}
      alpha_estrato: {1: -0.40, 2: -0.10, 3: 0.0, 4: 0.0, 5: -0.20, 6: -0.40}
      alpha_log_distancia: -0.40
      alpha_programa_ssia: 0.15
    prob_declara_saber11_sin_inscripcion: 0.35   # leads no inscritos que reportan su puntaje (S-24)
    interacciones:                          # registro de contactos del asesor (S-29)
      prob_sin_contacto_historico: 0.05
      prob_sin_contacto_campana: 0.15
      lambda_contactos: 1.2                 # contactos adicionales ~ Poisson
      extra_si_inscribe: 0.8
      dias_primer_contacto: 2.5             # media exponencial
      dias_entre_contactos: 6.0
      tipo: {LLAMADA: 0.45, WHATSAPP: 0.35, CORREO: 0.15, VISITA_CAMPUS: 0.05}
      resultado_intermedio: {NO_CONTESTA: 0.35, INTERESADO: 0.45, SOLICITA_INFORMACION: 0.20}
      resultado_final_no_inscrito: {NO_INTERESADO: 0.50, NO_CONTESTA: 0.50}

  # ---------------- BLOQUE 2: datos académicos y comerciales
  bachillerato:                             # notas de grados 10 y 11 por área, escala 1.0-5.0. SIMULADAS (S-25, S-34, S-35)
    media: 4.05                             # promedio acumulado en la zona (S-25)
    sd: 0.33
    minimo_aprobado: 3.0                    # nota final mínima para aprobar un área (desempeño básico)
    correlacion_dentro_colegio: 0.50        # entre compañeros del mismo colegio: nota vs. Saber 11 (S-34)
    peso_nivel_colegio: 0.10                # cuánto sube la nota un colegio de mejor nivel en el Saber 11 (S-34)
    sd_exigencia_colegio: 0.30              # variación de la exigencia al calificar entre colegios (S-34)
    encogimiento_colegio: 5                 # colegios con pocos evaluados: promedio × n/(n+5) (S-34)
    sensibilidad_area: 0.20                 # puntos de nota por DE de fortaleza relativa en el área (S-35)
    sd_tendencia_grado: 0.15                # cambio entre grado 10 y grado 11 (S-35)
    sd_nota_area: 0.20                      # variación propia de cada nota (S-35)
  beneficio_primer_semestre:                # matriculados nuevos eligen uno (S-27)
    cerca_hasta_km: 12
    cerca: {TRANSPORTE: 0.25, ALIMENTACION: 0.55, NINGUNO: 0.20}
    lejos: {TRANSPORTE: 0.55, ALIMENTACION: 0.30, NINGUNO: 0.15}
  financiacion:                             # modalidad elegida por los matriculados (S-28)
    prob_credito_por_estrato: {1: 0.50, 2: 0.45, 3: 0.30, 4: 0.18, 5: 0.10, 6: 0.05}
    pesos_entidad: {ICETEX: 0.35, SUFI: 0.15, FINCOMERCIO: 0.12, FINEDUCAR: 0.12, BANCO_PICHINCHA: 0.08, BANCO_DE_BOGOTA: 0.08, AV_VILLAS: 0.05, FNA: 0.05}
  dias_matricula_antes_de_clases: {min: 3, max: 75}
  foes:                                     # fondos municipales de educación superior (S-31, S-32)
    prob_solicita_y_aprueba: 0.55           # inscritos elegibles que solicitan y obtienen el apoyo
    promedio_minimo_renovacion: 3.5         # promedio del semestre anterior para renovar (cada convenio fija el suyo)
    prob_renueva: 0.90                      # cumpliendo el promedio, renueva a tiempo (abril-octubre)

  prob_cambio_residencia:                   # solo matriculados. supuesto: S-18
    - {desde_km: 0,  hasta_km: 15,  prob: 0.03}
    - {desde_km: 15, hasta_km: 25,  prob: 0.12}
    - {desde_km: 25, hasta_km: 999, prob: 0.25}

