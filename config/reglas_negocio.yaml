# Decreto 1290 de 2009, art. 5: cada colegio fija su escala y su equivalencia con la escala nacional (cortes: supuesto S-25)
escala_desempeno_bachillerato: {SUPERIOR: 4.6, ALTO: 4.0, BASICO: 3.0}

# -----------------------------------------------------------------------------
# SPRINTS 2 A 6 — Machine Learning (parámetros fijados ANTES de mirar los resultados de prueba)
# -----------------------------------------------------------------------------
# Validación temporal: se entrena con el pasado y se evalúa con el futuro (nunca al azar)
particion:
  entrenamiento: ["2024-1", "2024-2", "2025-1", "2025-2"]
  validacion: ["2026-1"]                    # para elegir hiperparámetros y umbral
  prueba: ["2026-2"]                        # se usa UNA sola vez, al final del Sprint 3
  campana: ["2027-1"]                       # resultado sellado: solo se abre en el Sprint 5

# Sprint 2 — ingeniería de características
caracteristicas:
  bandas_icfes:                             # segmento_rendimiento_icfes (umbral de beca = 310)
    - {desde: 0,   hasta: 250, segmento: BAJO}
    - {desde: 250, hasta: 310, segmento: MEDIO}
    - {desde: 310, hasta: 350, segmento: ALTO}
    - {desde: 350, hasta: 501, segmento: SUPERIOR}
  zonas_distancia_km: {CERCA: 10, MEDIA: 20}           # más de 20 km = LEJOS
  canal_agrupado:
    EVENTO: [EXPOESTUDIANTES, CAMPUS_DAY]
    RELACIONAL: [REFERIDO, INMERSION, COLEGIO_CONVENIO]
    DIGITAL: [SITIO_WEB, REDES_SOCIALES, LLAMADA_WHATSAPP]
  estrato_grupo: {1: BAJO, 2: BAJO, 3: MEDIO, 4: ALTO, 5: ALTO, 6: ALTO}
  peso_previo_modelo_base: 10               # suavizado del modelo base: "equivale a 10 aspirantes con la tasa del grupo mayor"
  kmeans:
    k_min: 3
    k_max: 7
    tolerancia_silueta: 0.01                # parsimonia: el menor k cuya silueta esté a menos de 0,01 de la mejor
    semilla: 20261029
    # Sin colegio_promedio_saber11: Admisiones no suele tener la media ICFES del colegio (bitácora H-43)
    variables: [estrato, log_distancia, punt_global, promedio_acumulado_colegio, edad_al_inscribirse, colegio_privado]

# Sprint 3 — modelos. Selección por log-loss en VALIDACION (2026-1); la PRUEBA (2026-2) se usa una sola vez.
modelado:
  semilla: 20261105
  umbral_clasificacion: 0.5                 # para el "error %" que pide el docente
  segmentos_propension: {ALTA: 0.60, BAJA: 0.35}   # >= 0.60 ALTA; < 0.35 BAJA; en medio MEDIA (dashboard)
  grillas:
    logistica: {C: [0.01, 0.1, 1.0, 10.0]}
    random_forest: {max_depth: [4, 6, 8, null], min_samples_leaf: [5, 20], max_features: [sqrt, 0.5]}
    xgboost: {n_estimators: [200, 400], max_depth: [2, 3, 4], learning_rate: [0.03, 0.1], min_child_weight: [5]}
    random_forest_beca: {max_depth: [3, 5, null], min_samples_leaf: [5, 15], max_features: [sqrt, 0.5]}
    xgboost_beca: {n_estimators: [150, 300], max_depth: [2, 3], learning_rate: [0.03, 0.1], min_child_weight: [5]}

# Sprint 5 — impacto comercial. TODOS son SUPUESTOS (S-37 a S-43) para validar con Admisiones y Mercadeo;
# cada uno tiene análisis de sensibilidad (-50% / +50%).
impacto:
  seguimiento:                              # Escenario 1: seguimiento priorizado de inscritos
    capacidad_pct: 0.30                     # S-37: los asesores alcanzan a hacer seguimiento intensivo al 30% de los inscritos
    efecto_maximo: 0.10                     # S-38: +10 puntos de probabilidad en un inscrito indeciso (p = 0,5); efecto = 0,10·4p(1−p)
    costo_por_inscrito: 30000               # S-39: costo del seguimiento intensivo (horas de asesor y llamadas), COP
  expo:                                     # Escenario 2: ExpoEstudiantes
    inversion_evento: 22000000              # = inversion_captacion.por_evento.EXPOESTUDIANTES (S-26)
  beca:                                     # Escenario 3: alerta temprana de pérdida de beca
    pct_marcado: 0.30                       # S-40: se ofrece tutoría al 30% de becados con mayor riesgo
    eficacia_tutoria: 0.25                  # S-41: la tutoría evita la pérdida en 1 de cada 4 que la habrían perdido
    costo_tutoria: 400000                   # S-42: costo de la tutoría por estudiante y semestre, COP
    semestres_restantes: 7                  # S-43: después del 1er semestre quedan 7 de 8 semestres

# Criterios de aceptación de la validación (definidos ANTES de generar)
validacion:
  trazabilidad_min: 1.0                     # 100% de los resultados Saber 11 iguales a su registro real del ICFES
  promedio_colegio:                         # notas simuladas: relación con el ICFES positiva pero imperfecta (S-34)
    corr_icfes: {min: 0.30, max: 0.55}
    discordancia_min: 0.10                  # mínimo 10% del quintil superior del ICFES con promedio bajo la mediana
  anclas:
    pct_becados_activos: {objetivo: 0.40, tolerancia: 0.10, fuente: "El Tiempo (2024): cerca del 40% de los estudiantes se benefician de becas."}
    tasa_matricula: {objetivo: 0.45, tolerancia: 0.03, fuente: "supuesto: S-15"}
    conversion_lead: {objetivo: 0.40, tolerancia: 0.03, fuente: "supuesto: S-23"}

supuestos:
  S-01: "Las tarifas 2027 se mantienen iguales a 2026 hasta que exista el acuerdo 2027."
  S-02: "Las becas no son acumulables entre sí; se aplica la de mayor porcentaje."
  S-03: "Fechas de inicio y fin de periodos aproximadas (febrero y agosto)."
  S-04: "Volumen relativo de inscripciones por periodo y programa (mayor en periodos -1 por calendario A; SSIA con alta demanda inicial)."
  S-05: "Perfil del aspirante a una universidad privada de costo medio: más estratos 2-4, menos puntajes muy altos, menor proporción de mujeres en ingenierías TIC y decaimiento con la distancia (Huff, 1964)."
  S-06: "Años de rezago entre el Saber 11 y la inscripción, anclados a la tasa de tránsito inmediato de Bogotá (52%, MEN 2023)."
  S-07: "Extranjeros: 70% PPT y 30% C.E.; el PEP no se genera porque venció el 28-feb-2023 (Decreto 216 de 2021)."
  S-08: "Distribución de estado civil por edad."
  S-09: "35% de los aspirantes reporta teléfono fijo."
  S-10: "Distribución de canales de captación."
  S-11: "12% de los colegios tienen convenio con la universidad."
  S-12: "85% presenta entrevista; 97% de los inscritos es admitido (no hay examen de admisión)."
  S-13: "Probabilidad de otorgar Beca Saber 11 y Mi Vocación."
  S-14: "45% de los matriculados usa pronto pago en el primer semestre."
  S-15: "Coeficientes del modelo verdadero de matrícula y tasa global de 45%."
  S-16: "Rendimiento académico: media 3.95, correlación latente 0.45 con el ICFES, varianzas entre y dentro de estudiantes."
  S-17: "Riesgo de deserción por semestre."
  S-18: "Probabilidad de cambiar de residencia por cercanía según distancia."
  S-19: "Proporción de estratos por localidad = proporción de placas de Catastro en manzanas de cada estrato (estratificación oficial por manzana de la SDP). Aproximación: una placa no es un hogar (un edificio tiene una placa y muchos hogares)."
  S-20: "Pesos de EPS por régimen en Bogotá."
  S-21: "La pérdida de beca es definitiva; se evalúa al cierre de cada semestre con el promedio acumulado (créditos iguales por semestre)."
  S-22: "Mi Vocación exige entrevista con psicología y puntaje vocacional >= 3 (requisito 'interés claro por el programa')."
  S-23: "Conversión lead -> inscripción: modelo logístico por canal, estrato, distancia, programa y asesor; tasa global 40%; retraso Gamma(2, 12 días)."
  S-24: "35% de los leads que no se inscriben declara su puntaje Saber 11 en la preinscripción."
  S-25: "Promedio acumulado del colegio en escala 1.0-5.0: media 4.05 y DE 0.33 en la zona (distribución Beta entre 3.0 y 5.0); cortes de desempeño 4.6 / 4.0 / 3.0. Se simula porque no hay datos abiertos colombianos con notas del colegio por estudiante."
  S-26: "Fechas de eventos (salvo Expo 2025) e inversión de captación por canal y periodo."
  S-27: "Todos los matriculados nuevos eligen transporte, alimentación o ninguno; la elección depende de la distancia."
  S-28: "Probabilidad de crédito educativo según estrato y participación de cada entidad aliada."
  S-29: "Número, tipo y resultado de los contactos de los asesores."
  S-30: "El resultado Saber 11 está disponible al momento de la inscripción."
  S-31: "FOES/FOEST: 55% de los inscritos elegibles obtiene el apoyo; $1.000.000 por semestre (mínimo publicado por Chía, usado también en Sopó y Tocancipá); aumenta la probabilidad de matrícula (β = 0,5)."
  S-32: "El apoyo FOES se renueva si el promedio del semestre anterior es >= 3.5 (90% renueva a tiempo); si se pierde, no se recupera."
  S-33: "Los puntajes Saber 11 son registros reales de 2019-2 y 2022-2 (ICFES, kgxf-xxbe); a cada aspirante se le asigna el año de examen de su periodo de interés y rezago. Se supone que la escala del examen es comparable entre esos años."
  S-34: "Notas del colegio: entre compañeros la nota se correlaciona 0,50 con el Saber 11; el nivel del colegio pesa 0,10; la exigencia al calificar varía entre colegios (DE 0,30); el resto es esfuerzo individual. Base: cada colegio define su sistema de evaluación (Decreto 1290 de 2009)."
  S-35: "Notas por área y grado: cada área se mueve 0,20 puntos por DE de fortaleza relativa en esa prueba del Saber 11; tendencia de grado 10 a 11 con DE 0,15; variación de cada nota con DE 0,20; nota final mínima 3.0 (área aprobada)."
  S-36: "El esfuerzo que se ve en las notas del colegio y no en el ICFES también influye en el promedio universitario (peso 0,30)."
  S-37: "Los asesores alcanzan a hacer seguimiento intensivo al 30% de los inscritos de una campaña."
  S-38: "El seguimiento sube la probabilidad de matrícula hasta 10 puntos en un inscrito indeciso (p = 0,5) y casi nada en quien ya decidió: efecto = 0,10 · 4p(1 − p)."
  S-39: "El seguimiento intensivo cuesta $30.000 por inscrito (horas de asesor y llamadas)."
  S-40: "La tutoría de alerta temprana se ofrece al 30% de becados con mayor riesgo de perder la beca."
  S-41: "La tutoría evita la pérdida de beca en 1 de cada 4 becados que la habrían perdido."
  S-42: "La tutoría cuesta $400.000 por estudiante en el semestre."
  S-43: "Después del primer semestre quedan 7 semestres; la deserción por semestre sigue los supuestos S-17 (x1,5 si se pierde la beca)."
  S-44: "Distancia por vías estimada = tramo norte-sur + tramo oriente-occidente entre la dirección y el campus (distancia de cuadra o Manhattan): en Bogotá las calles van de oriente a occidente y las carreras de norte a sur. No se encontró un estudio colombiano del factor de rodeo; no se usa uno extranjero."
  S-45: "Dirección de residencia: una dirección real al azar (Catastro Bogotá en manzana del mismo estrato del registro ICFES; DANE en Sabana Centro, sin estrato por manzana disponible). Ninguna dirección corresponde a la persona sintética."
